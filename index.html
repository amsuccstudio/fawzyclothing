<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fawzy Clothing | Perfectly Stitched</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="#home" class="logo" id="brandName">Fawzy Clothing</a>
      <ul class="nav-links">
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section id="home" class="hero">
    <div class="container">
      <h1 class="hero-title" id="brandHero">Fawzy Clothing</h1>
      <p class="hero-tagline" id="tagline">Perfectly Stitched</p>
      <p class="hero-text" id="heroText">Bespoke tailoring for every occasion.</p>
      <a href="#gallery" class="btn-primary">View Gallery</a>
    </div>
  </section>

  <section id="gallery" class="gallery">
    <div class="container">
      <h2 class="section-title">Our Work</h2>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </section>

  <section id="services" class="services">
    <div class="container">
      <h2 class="section-title">Services</h2>
      <div class="services-grid" id="servicesGrid"></div>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="container">
      <h2 class="section-title">Place an Order</h2>
      <p class="section-subtitle" id="contactText">Reach out on WhatsApp to get started.</p>
      <a href="#" id="whatsappMain" class="btn-primary" target="_blank">
        <i class="fab fa-whatsapp"></i> Chat on WhatsApp
      </a>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; <span id="year"></span> <span id="footerBrand">Fawzy Clothing</span>. Perfectly Stitched.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
